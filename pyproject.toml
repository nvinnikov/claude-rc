[project]
name = "claude-rc"
version = "0.2.0"
description = "Telegram bot that starts Claude Code Remote Control sessions on your own machine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikita Vinnikov", email = "nvvinnikov@gmail.com" }]
keywords = ["claude", "claude-code", "telegram", "tmux", "remote-control", "git-worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "aiogram>=3.15",
]

[project.urls]
Homepage = "https://github.com/nvinnikov/claude-rc"
Source = "https://github.com/nvinnikov/claude-rc"
Issues = "https://github.com/nvinnikov/claude-rc/issues"
Changelog = "https://github.com/nvinnikov/claude-rc/releases"

[project.scripts]
claude-rc = "clauderc.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["clauderc", "tests"]
# ruff format переписывает и python-блоки внутри markdown. В docs/ лежат планы и
# спеки — записи о том, как код выглядел тогда; переформатировать их нельзя.
extend-exclude = ["docs"]

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E/W), isort(I), bugbear(B), pyupgrade(UP), comprehensions(C4)
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["clauderc", "tests"]

# aiogram отдаёт свои типы, но обработчики регистрируются декораторами, которые
# mypy видит как нетипизированные — на границе с фреймворком strict не помогает.
[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clauderc*"]
