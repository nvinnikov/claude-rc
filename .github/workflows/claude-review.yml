# Автоматическое ревью пул-реквестов.
#
# Что крутить:
#   - глубина/строгость .... строка "Depth:" в промпте
#   - шкала важности ....... строка "Severity:" в промпте + раздел в CLAUDE.md
#   - модель ............... claude_args --model
#   - бюджет ходов ......... claude_args --max-turns
#   - что пропускать ....... on.pull_request.paths-ignore
#
# Нужен секрет репозитория CLAUDE_CODE_OAUTH_TOKEN (получить: `claude setup-token`).
# Без него джоба ничего не делает; сборку в любом случае гейтит ci.yml.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'LICENSE'
      - '.gitignore'
      - 'docs/screenshot.jpg'

# Новый пуш в тот же PR отменяет незакончившееся ревью.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    # Нет токена — джоба тихо пропускается вместо красного креста на каждом PR.
    # secrets нельзя читать в job-level `if`, но можно в env, а его — в step-level.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN не задан — ревью пропущено (см. README)."

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ты — автоматический ревьюер этого проекта: Telegram-бот, который
            поднимает на локальной машине сессии Claude Code с Remote Control,
            оркестрируя tmux и git worktree. Ревьюй пул-реквест по разделу
            "Code Review Guidelines" в CLAUDE.md в корне репозитория.

            Читай изменения через `gh pr diff`. НЕ запускай инструменты — ни ruff,
            ни mypy, ни pytest, ни сборку. Ревьюй статически по диффу; для
            контекста можно `Read`/`Grep` соседние файлы. Формат, линт, типы и
            тесты уже гейтит CI.

            Приоритеты (полный список — в CLAUDE.md), по убыванию:
              1. Секреты и доступ — токен бота или содержимое config.toml в
                 логах/коде/сообщениях, ослабление проверки allowed_user_id,
                 обработчик без неё, ссылка на сессию в общедоступном месте.
              2. Небезопасный запуск — интерполяция пользовательского ввода в
                 команды tmux/git/shell без shlex.quote, путь из сообщения,
                 попадающий в команду как есть.
              3. Потеря работы пользователя — удаление worktree в обход проверки
                 blockers, force по умолчанию, снос каталога с незакоммиченными
                 изменениями, kill сессии там, где этого не ждут.
              4. Регрессии контракта сессий — поиск сессии по имени вместо
                 realpath каталога, повторный запуск, плодящий вторую сессию в
                 том же каталоге, потеря @rc_url, автоответ на диалог доверия.
              5. Интеграционные грабли — target-синтаксис tmux (`=имя` против
                 `=имя:`), callback_data длиннее 64 байт, работа с
                 query.message без сужения до Message, отсутствие таймаута.
              6. Молчаливые сбои — проглоченные исключения, ошибка tmux или git,
                 не доехавшая до пользователя, пустой except без причины.
              7. Отсутствие тестов — изменение поведения без теста.

            Depth: BALANCED. Сообщай реальные проблемы средней и выше
            уверенности. Пропускай придирки к стилю (их гейтит ruff) и
            спекулятивные замечания. Не выдумывай находки.

            Severity: начинай каждый инлайн-комментарий ровно одним из:
              🔴 Blocker — утечка секрета, обход авторизации, инъекция в команду,
                 потеря работы пользователя или регрессия контракта сессий;
                 чинить до мержа.
              🟡 Should-fix — реальная проблема, не блокирующая мерж.
            Если это всего лишь придирка — не пиши её вовсе.

            Находки публикуй инлайн-комментариями на точных строках через
            `mcp__github_inline_comment__create_inline_comment` с
            `confirmed: true`. Затем один `gh pr comment` с итогом (например
            "2 🔴, 1 🟡") и сквозными замечаниями. Если поднимать нечего —
            короткий итог о том, что PR чистый.

            Комментарии пиши на русском.
          claude_args: |
            --model claude-opus-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
