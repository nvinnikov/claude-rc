# Скопируй в config.toml и заполни. config.toml в git не попадает.
bot_token = "123456:REPLACE_ME"

# Твой Telegram user_id (@userinfobot). Только он может управлять ботом.
allowed_user_id = 0

# Где искать репозитории. Сами корни тоже валидные цели (рабочий зонт без .git).
rc_roots = ["~/code", "~/Documents"]

# Глубина обхода от каждого корня. 3 нужны, чтобы достать
# <монорепо>/services/<сервис>.
scan_depth = 3

# Куда складывать git worktree'ы, создаваемые командой /rc <репо> <ветка>.
# Каталог создаётся сам при первом worktree.
worktree_root = "~/.claude-rc/worktrees"

# Где помнить текущий каталог навигации (/cd) между перезапусками бота.
state_path = "~/.claude-rc/state.json"

# Сколько секунд ждать, пока claude напечатает ссылку на сессию.
launch_timeout_s = 90

# С какими правами поднимать сессии. Без него — как у claude по умолчанию, то есть
# он спрашивает на каждом шаге, а с телефона это неудобно. Значения: manual (ручной),
# acceptEdits, plan, auto, dontAsk, bypassPermissions — ровно то, что принимает
# `claude --permission-mode`. Гейта прав на стороне бота по-прежнему нет: флаг
# только говорит claude, с чего начать.
# permission_mode = "acceptEdits"

# Подтягивать ли origin перед запуском сессии. Идёт по правилам `claude-rc sync`:
# грязное дерево и отсоединённый HEAD не трогаются, история только перематывается
# вперёд. Для запуска с веткой тянется репозиторий, а worktree уже создаётся от
# свежего HEAD.
# pull_before_start = true
