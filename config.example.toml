# Скопируй в config.toml и заполни. config.toml в git не попадает.
bot_token = "123456:REPLACE_ME"

# Твой Telegram user_id (@userinfobot). Только он может управлять ботом.
allowed_user_id = 0

# Где искать репозитории. Сами корни тоже валидные цели (рабочий зонт без .git).
rc_roots = ["~/Documents/Flybo", "~/Documents"]

# Глубина обхода от каждого корня. 3 нужны, чтобы достать
# flybo-arch-v2/services/<сервис>.
scan_depth = 3

# Сколько секунд ждать, пока claude напечатает ссылку на сессию.
launch_timeout_s = 90
